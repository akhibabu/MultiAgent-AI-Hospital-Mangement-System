name: Real Data Agent Validation

on:
  workflow_dispatch:
    inputs:
      max_cases:
        description: "Maximum cases per real-data task"
        required: false
        default: "1000"
  push:
    paths:
      - "hospital-ai/validation/real_data/**"
      - "hospital-ai/validation/datasets/hangu_real/**"
      - "hospital-ai/backend/app/ai/emergency/**"
      - "hospital-ai/backend/app/ai/resource_allocation/**"
      - "hospital-ai/backend/app/ai/digital_twin/**"
  pull_request:
    paths:
      - "hospital-ai/validation/real_data/**"
      - "hospital-ai/validation/datasets/hangu_real/**"
      - "hospital-ai/backend/app/ai/emergency/**"
      - "hospital-ai/backend/app/ai/resource_allocation/**"
      - "hospital-ai/backend/app/ai/digital_twin/**"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile validation and agent code
        run: |
          python -m py_compile validation/real_data/run_real_data_validation.py
          python -m py_compile backend/app/ai/emergency/triage_classifier.py
          python -m py_compile backend/app/ai/resource_allocation/availability_assessor.py
          python -m py_compile backend/app/ai/digital_twin/simulator.py

      - name: Run empirical validation
        env:
          MAX_CASES: \${{ github.event.inputs.max_cases || '1000' }}
        run: |
          python validation/real_data/run_real_data_validation.py --max-cases "$MAX_CASES"

      - name: Commit measured result artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hospital-ai/validation/results/dataset/real_data_v1
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "ci(validation): record real-data benchmark results [skip ci]"
            git push
          fi

      - name: Upload full result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-data-validation-results
          path: hospital-ai/validation/results/dataset/real_data_v1
