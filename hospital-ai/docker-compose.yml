services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospital-ai-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hospital-ai-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: hospital-ai-network
