name: Digital Twin Check

on:
  pull_request:
    paths:
      - "hospital-ai/backend/app/ai/digital_twin/**"
      - "hospital-ai/backend/app/repositories/digital_twin_repository.py"
      - "hospital-ai/backend/app/schemas/digital_twin.py"
      - "hospital-ai/backend/app/services/digital_twin_service.py"
      - "hospital-ai/backend/app/routes/digital_twin.py"
      - "hospital-ai/backend/app/api/__init__.py"
      - "hospital-ai/backend/migrations/024_create_digital_twin.sql"
      - "hospital-ai/backend/tests/test_digital_twin.py"
      - "hospital-ai/frontend/src/pages/AI/DigitalTwinPage.tsx"
      - "hospital-ai/frontend/src/hooks/useDigitalTwin.ts"
      - "hospital-ai/frontend/src/services/digitalTwinService.ts"
      - "hospital-ai/frontend/src/types/digitalTwin.ts"
      - "hospital-ai/frontend/src/routes/AppRoutes.tsx"
      - "hospital-ai/frontend/src/layouts/MainLayout.tsx"
      - "hospital-ai/frontend/src/pages/AI/AICenterPage.tsx"
      - ".github/workflows/digital-twin-check.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: hospital-ai/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install email-validator pytest
      - name: Test Digital Twin
        working-directory: hospital-ai/backend
        env:
          PYTHONPATH: ${{ github.workspace }}/hospital-ai/backend
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_ANON_KEY: "test-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
          SUPABASE_JWT_SECRET: "test-jwt-secret"
        run: pytest -q tests/test_digital_twin.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hospital-ai/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: hospital-ai/frontend
        run: npm ci
      - name: Build frontend
        working-directory: hospital-ai/frontend
        run: npm run build
