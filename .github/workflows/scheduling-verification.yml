name: Scheduling Agent Verification

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  backend-scheduling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest email-validator
      - run: python -m compileall app
      - run: python -c "from app.api import api_router; paths=sorted({r.path for r in api_router.routes if 'scheduling' in r.path}); print(paths); assert '/ai/scheduling/start' in paths"
      - run: pytest -q tests/test_scheduling_agent.py

  frontend-scheduling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hospital-ai/frontend/package-lock.json
      - run: npm ci
      - shell: bash
        run: |
          cat > tsconfig.scheduling-check.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "useDefineForClassFields": true,
              "lib": ["ES2022", "DOM", "DOM.Iterable"],
              "allowJs": false,
              "skipLibCheck": true,
              "esModuleInterop": true,
              "allowSyntheticDefaultImports": true,
              "strict": true,
              "forceConsistentCasingInFileNames": true,
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "react-jsx",
              "baseUrl": ".",
              "paths": { "@/*": ["src/*"] },
              "types": ["vite/client"]
            },
            "include": [
              "src/pages/AI/SchedulingAgentPage.tsx",
              "src/hooks/useScheduling.ts",
              "src/services/schedulingService.ts",
              "src/types/scheduling.ts",
              "src/types/appointment.ts"
            ]
          }
          EOF
          npx tsc -p tsconfig.scheduling-check.json
