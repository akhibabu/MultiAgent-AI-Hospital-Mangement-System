name: New Agents Dataset Validation

on:
  push:
    branches:
      - feature/validation-new-agents
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run new-agent validation
        env:
          PYTHONPATH: backend
        run: python validation/pipeline/run_new_agents_validation.py --cases 25

      - name: Record new-agent validation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/results/dataset/new_agents_v1
          git diff --cached --quiet && echo "No validation result changes." && exit 0
          git commit -m "chore: record new-agent validation results [skip ci]"
          git push

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-ai/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hospital-ai/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
