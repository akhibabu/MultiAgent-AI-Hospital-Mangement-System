name: Emergency Agent Verification

on:
  push:
    branches:
      - feature/emergency-agent
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-emergency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-ai/backend
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall app
      - run: pytest -q tests/test_emergency_agent.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hospital-ai/frontend/package-lock.json
      - run: npm ci
      - name: Type-check Emergency Agent dependency graph
        run: |
          cat > tsconfig.emergency.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "jsx": "react-jsx",
              "strict": true,
              "skipLibCheck": true,
              "noEmit": true,
              "baseUrl": ".",
              "types": ["vite/client"],
              "paths": { "@/*": ["src/*"] },
              "lib": ["ES2022", "DOM", "DOM.Iterable"]
            },
            "include": ["src/pages/AI/EmergencyAgentPage.tsx"]
          }
          EOF
          npx tsc -p tsconfig.emergency.json

# Verification workflow intentionally kept on the feature branch during implementation.
# Final Emergency backend/frontend verification pass.
