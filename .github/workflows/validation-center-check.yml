name: Validation Center Check

on:
  pull_request:
    paths:
      - "hospital-ai/backend/app/routes/validation.py"
      - "hospital-ai/backend/app/schemas/validation.py"
      - "hospital-ai/frontend/src/pages/validation/**"
      - "hospital-ai/frontend/src/types/validation.ts"
      - "hospital-ai/frontend/src/services/validationApi.ts"
      - "hospital-ai/frontend/src/hooks/useValidation.ts"
      - "hospital-ai/frontend/src/components/validation/**"
      - "hospital-ai/frontend/src/utils/validationDisplay.ts"
      - "hospital-ai/validation/**"
      - ".github/workflows/validation-center-check.yml"

jobs:
  validation-center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend dependencies
        working-directory: hospital-ai/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install email-validator
      - name: Validation API import
        working-directory: hospital-ai/backend
        run: python -c "from app.routes.validation import router; from app.schemas.validation import ValidationOverview; print(len(router.routes))"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hospital-ai/frontend/package-lock.json
      - name: Frontend dependencies
        working-directory: hospital-ai/frontend
        run: npm ci
      - name: Frontend build
        working-directory: hospital-ai/frontend
        run: npm run build