name: Resource Allocation Agent Check

on:
  push:
    branches:
      - feature/resource-allocation-agent

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest email-validator
      - name: Run Resource Allocation tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/test_resource_allocation_agent.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hospital-ai/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check resource allocation files
        run: |
          cat > tsconfig.resource-allocation-check.json <<'EOF'
          {
            "extends": "./tsconfig.app.json",
            "include": [
              "src/pages/AI/ResourceAllocationAgentPage.tsx",
              "src/hooks/useResourceAllocation.ts",
              "src/services/resourceAllocationService.ts",
              "src/types/resourceAllocation.ts",
              "src/hooks/usePatients.ts",
              "src/types/patient.ts",
              "src/services/patientService.ts",
              "src/components/common/Badge.tsx",
              "src/components/common/Card.tsx",
              "src/components/common/ErrorBoundary.tsx",
              "src/components/ui/Loading.tsx",
              "src/services/apiClient.ts",
              "src/vite-env.d.ts"
            ]
          }
          EOF
          npx tsc -p tsconfig.resource-allocation-check.json --noEmit
